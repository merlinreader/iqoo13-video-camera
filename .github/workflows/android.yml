name: Android APK
on:
  push:
    branches: [main]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract Kotlin Android project
        run: unzip -o source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, signed debug APK and Android Lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Check debug APK signature, manifest and version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ru.iqoo.camera'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='0.1.1'"
          cp "$APK" iqoo13-camera-v0.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iqoo13-camera-v0.1.1-apk
          path: iqoo13-camera-v0.1.1.apk
          retention-days: 7
      - name: Publish release after all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 iqoo13-camera-v0.1.1.apk source.zip \
            --title 'iQOO 13 Video Camera v0.1.1: Preview Geometry Fix' \
            --notes 'Camera2 preview orientation and aspect ratio corrected. MP4 recording pipeline unchanged. Kotlin geometry unit tests, Android Lint and APK signature verification passed in CI. Not yet verified on physical iQOO 13. Previous v0.1.0 debug signature differs: uninstall previous APK before installing this one if Android reports a signature conflict; gallery recordings remain.' \
            --prerelease
